name: Browser QA - mobile marketplace and moderation
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/ui_acceptance.py'
      - '.github/workflows/browser-qa.yml'
      - 'src/**'
      - 'app.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    name: Playwright mobile UX on branch preview (mocked moderation)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Build and test this branch's browser assets on mobile viewports
        env:
          HYJOBS_URL: http://127.0.0.1:8765/app.html
          UI_ARTIFACT_DIR: qa-browser-artifacts
        run: |
          node scripts/build-pages.mjs
          python -m http.server 8765 --bind 127.0.0.1 --directory dist > /tmp/hyj-browser-server.log 2>&1 &
          python tests/ui_acceptance.py
      - name: Upload screenshots and assertion results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hung-yen-jobs-browser-qa
          path: qa-browser-artifacts/
          if-no-files-found: warn
          retention-days: 14
