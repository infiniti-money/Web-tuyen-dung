name: Browser QA - mobile marketplace and moderation
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/ui_acceptance.py'
      - '.github/workflows/browser-qa.yml'
      - 'src/**'
      - 'app.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    name: Playwright mobile UX and readonly production checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test deployed marketplace on phone viewports and isolated Admin UI
        env:
          HYJOBS_URL: https://infiniti-money.github.io/Web-tuyen-dung/app.html
          UI_ARTIFACT_DIR: qa-browser-artifacts
        run: python tests/ui_acceptance.py
      - name: Upload screenshots and assertion results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hung-yen-jobs-browser-qa
          path: qa-browser-artifacts/
          if-no-files-found: warn
          retention-days: 14
