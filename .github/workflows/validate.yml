name: Validate recruitment website
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/fullstack-recruitment-v2]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check src/app.js
          node --check src/marketplace.js
          node --check src/bookmarks.js
          node --check src/account-features.js
          node --check scripts/build-pages.mjs
          node --test tests/smoke.test.mjs
          node scripts/build-pages.mjs
